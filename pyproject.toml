[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.12", "flit-scm", "wheel" ]

[project]
name = "django-s3file"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 6 - Mature",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [
  "boto3",
  "django>=5.2.13",
  "django-storages>=1.14.6",
]
[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"
[project.urls]
Changelog = "https://github.com/codingjoe/django-s3file/releases"
Documentation = "https://github.com/codingjoe/django-s3file?tab=readme-ov-file"
Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/codingjoe/django-s3file"
Issues = "https://github.com/codingjoe/django-s3file/issues"
Releasenotes = "https://github.com/codingjoe/django-s3file/releases/latest"
Source = "https://github.com/codingjoe/django-s3file"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest>=9.0.3",
  "pytest-cov",
  "pytest-django",
  "selenium",
]

[tool.setuptools_scm]
write_to = "s3file/_version.py"

[tool.flit]
[tool.flit.module]
name = "s3file"

[tool.ruff]
line-length = 88
indent-width = 4
src = [ "s3file", "tests" ]
[tool.ruff.format]
preview = true
indent-style = "space"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
per-file-ignores."tests/**" = [ "DJ006", "DJ007", "DJ008", "PLR2004", "S101", "S105", "S106", "S311", "S603", "S607" ]
flake8-pytest-style.fixture-parentheses = false
flake8-pytest-style.mark-parentheses = false
isort.combine-as-imports = true
isort.force-wrap-aliases = true
isort.known-first-party = [ "s3file", "tests" ]
isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
isort.split-on-trailing-comma = true
pydocstyle.convention = "pep257"

[tool.pytest]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
  "tests",
]
addopts = "--cov --cov-report=xml --cov-report=term --tb=short -rxs"
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
[tool.coverage.run]
source = [ "s3file" ]
[tool.coverage.report]
skip_covered = true
show_missing = true
